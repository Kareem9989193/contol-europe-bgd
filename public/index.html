<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Europe Conquest — Grand-Strategy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

  <!-- ═══════════════════════════════════════════════════════════════════════════
       SCREEN 1: MAIN MENU (Pure background image + interactive hotspots)
  ════════════════════════════════════════════════════════════════════════════ -->
  <div id="main-menu-screen" class="screen active">
    <div class="menu-stage-wrapper">
      <img src="/assets/menu_bg.jpg" class="menu-art-bg" alt="Europe Conquest Menu" />

      <!-- Interactive Click Hotspots over the image buttons -->
      <button id="btn-create-game" class="art-hotspot hotspot-create" title="Create Game"></button>
      <button id="btn-join-game" class="art-hotspot hotspot-join" title="Join Game"></button>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════════════════════════════════════
       SCREEN 2: TACTICAL GAMEPLAY SCREEN (Europe Map + Live Warfare)
  ════════════════════════════════════════════════════════════════════════════ -->
  <div id="game-screen" class="screen">
    <!-- Top HUD Bar -->
    <header class="tactical-top-hud">
      <div class="hud-left">
        <button id="btn-tactical-exit" class="btn-hud-hq">↩ HQ</button>
        <span class="hud-title">EUROPE CONQUEST</span>
      </div>

      <div class="hud-center">
        <span class="hud-label">TURN:</span>
        <span id="hud-commander-name" class="hud-player-turn">Commander</span>
        <span id="hud-turn-phase" class="hud-phase-pill">REINFORCE</span>
      </div>

      <div class="hud-right">
        <div id="reinforce-hud-box" class="reinforce-box" style="display:none;">
          <span>TROOPS:</span>
          <strong id="hud-reinforce-count">0</strong>
        </div>
        <button id="btn-end-phase" class="btn-hud-next">NEXT PHASE ❯</button>
      </div>
    </header>

    <!-- Canvas Map Viewport -->
    <div class="canvas-container">
      <canvas id="game-canvas"></canvas>
    </div>

    <!-- Live Factions Panel -->
    <div class="factions-hud-panel">
      <div class="factions-header">COMMANDERS</div>
      <div id="intel-factions-list" class="factions-items"></div>
    </div>

    <!-- Battle Log -->
    <div class="battle-log-hud">
      <div class="log-header">BATTLE LOG</div>
      <div id="intel-battle-log" class="log-items"></div>
    </div>

    <!-- Floating Country Tooltip -->
    <div id="tactical-country-tooltip" class="tactical-tooltip" style="display:none;">
      <div id="tip-country-name" class="tip-country-name">GERMANY</div>
      <div class="tip-detail">
        <span>Owner:</span>
        <strong id="tip-country-owner">Neutral</strong>
      </div>
      <div class="tip-detail">
        <span>Garrison:</span>
        <strong id="tip-country-armies" class="highlight">3 Armies</strong>
      </div>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════════════════════════════════════
       MODALS: CLEAN CREATE & JOIN
  ════════════════════════════════════════════════════════════════════════════ -->

  <!-- Modal: Create Game -->
  <div id="modal-create-game" class="clean-modal-backdrop" style="display:none;">
    <div class="clean-modal-box">
      <div class="clean-modal-header">
        <span>CREATE GAME</span>
        <button class="modal-close-x" data-close="modal-create-game">✕</button>
      </div>
      <div class="clean-modal-body">
        <div class="input-group">
          <label>Your Name</label>
          <input type="text" id="create-player-name" class="clean-input" placeholder="Enter your name" maxlength="20" value="Commander" />
        </div>
        <div class="input-group">
          <label>Room Name</label>
          <input type="text" id="create-room-name" class="clean-input" placeholder="Room Name" maxlength="30" value="Europe Room" />
        </div>
        <div class="input-group">
          <label>Max Players</label>
          <select id="create-room-max" class="clean-select">
            <option value="2">2 Players</option>
            <option value="3">3 Players</option>
            <option value="4" selected>4 Players</option>
            <option value="6">6 Players</option>
          </select>
        </div>
        <div class="input-group">
          <label>Mode</label>
          <div class="mode-chips-row">
            <label class="clean-chip active">
              <input type="radio" name="game-mode" value="online" checked /> 🌐 Online
            </label>
            <label class="clean-chip">
              <input type="radio" name="game-mode" value="bots" /> 🤖 Solo vs AI
            </label>
          </div>
        </div>
      </div>
      <div class="clean-modal-footer">
        <button id="btn-submit-create" class="btn-action-primary">START GAME</button>
      </div>
    </div>
  </div>

  <!-- Modal: Join Game -->
  <div id="modal-join-game" class="clean-modal-backdrop" style="display:none;">
    <div class="clean-modal-box">
      <div class="clean-modal-header">
        <span>JOIN GAME</span>
        <button class="modal-close-x" data-close="modal-join-game">✕</button>
      </div>
      <div class="clean-modal-body">
        <div class="input-group">
          <label>Your Name</label>
          <input type="text" id="join-player-name" class="clean-input" placeholder="Enter your name" maxlength="20" value="Commander" />
        </div>
        <div class="input-group">
          <label>Active Rooms</label>
          <div id="modal-rooms-list" class="rooms-container">
            <div class="no-rooms-msg">Searching for rooms...</div>
          </div>
        </div>
        <div class="input-group">
          <label>Or Enter Room Code Directly</label>
          <div class="code-join-row">
            <input type="text" id="join-room-code-input" class="clean-input" placeholder="Room ID..." />
            <button id="btn-join-code-direct" class="btn-code-connect">JOIN</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal: Waiting Room -->
  <div id="modal-waiting-room" class="clean-modal-backdrop" style="display:none;">
    <div class="clean-modal-box">
      <div class="clean-modal-header">
        <span id="waiting-room-title">ROOM</span>
      </div>
      <div class="clean-modal-body">
        <div class="waiting-players-list" id="waiting-commanders-grid"></div>
        <div class="share-row">
          <input type="text" id="room-share-link" class="clean-input" readonly />
          <button id="btn-copy-link" class="btn-code-connect">COPY LINK</button>
        </div>
      </div>
      <div class="clean-modal-footer dual">
        <button id="btn-leave-lobby" class="btn-cancel">LEAVE</button>
        <button id="btn-launch-game" class="btn-action-primary">START GAME</button>
      </div>
    </div>
  </div>

  <!-- Combat Clash Overlay -->
  <div id="tactical-combat-modal" class="combat-overlay" style="display:none;">
    <div class="combat-box">
      <div class="combat-title">⚔️ BATTLE ⚔️</div>
      <div class="combat-sides">
        <div class="combat-side atk">
          <div class="side-name" id="clash-atk-name">Attacker</div>
          <div class="dice-row" id="clash-atk-dice"></div>
        </div>
        <div class="vs-divider">VS</div>
        <div class="combat-side def">
          <div class="side-name" id="clash-def-name">Defender</div>
          <div class="dice-row" id="clash-def-dice"></div>
        </div>
      </div>
      <div id="clash-outcome-text" class="clash-result"></div>
    </div>
  </div>

  <!-- Victory Screen -->
  <div id="tactical-victory-modal" class="victory-overlay" style="display:none;">
    <div class="victory-box">
      <div class="trophy">🏆</div>
      <h2>VICTORY!</h2>
      <p id="victory-winner-announcement"></p>
      <button id="btn-victory-hq" class="btn-action-primary">BACK TO MENU</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/map.js"></script>
  <script src="/js/game.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
